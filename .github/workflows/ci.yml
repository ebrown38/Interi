# SPDX-License-Identifier: MIT
name: CI

permissions:
  contents: read

on:
  push: # all branches: feature-branch pushes tolerate `pending` (TDD red) tests
  pull_request: # PRs and main must not contain pending tests
  schedule:
    - cron: "0 7 * * *" # nightly: sanitizers + long-running test labels
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  # GPU tests run on Mesa's lavapipe on Linux and must not silently skip there (they skip on Windows runners,
  # which have no Vulkan driver).
  FEDORA_PACKAGES: >-
    clang lld llvm compiler-rt clang-tools-extra cmake ninja-build git python3
    zip unzip tar curl pkgconf-pkg-config perl-IPC-Cmd mesa-vulkan-drivers vulkan-tools vulkan-validation-layers
    libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXi-devel libXfixes-devel libXScrnSaver-devel
    libXtst-devel wayland-devel wayland-protocols-devel libxkbcommon-devel mesa-libEGL-devel libdecor-devel

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False clang-tools-extra git python3
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -- '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: SPDX headers
        run: python3 tools/license_check/check_spdx_headers.py

  linux:
    runs-on: ubuntu-24.04
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-debug, linux-clang-release, linux-clang-asan, linux-clang-tidy, linux-clang-profile]
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False $FEDORA_PACKAGES
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: vcpkg
        run: |
          git config --global --add safe.directory '*'
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-
      - run: external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Unit, stress, benchmark smoke and GPU (lavapipe) tests
        if: matrix.preset != 'linux-clang-tidy'
        env:
          INTERI_REQUIRE_GPU: 1
        run: ctest --preset ${{ matrix.preset }} -L "unit|stress|benchmark|integration|golden"
      - name: Golden image mismatches (actual + diff)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-output-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/golden-output
          if-no-files-found: ignore
      - name: Pending (TDD red) tests, informational
        if: matrix.preset == 'linux-clang-debug' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        continue-on-error: true
        run: ctest --test-dir build/${{ matrix.preset }} -L pending --output-on-failure
      - name: No pending tests may reach main
        if: matrix.preset == 'linux-clang-debug' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: |
          extra=$(ctest --test-dir build/${{ matrix.preset }} -N -L pending | grep -E '^ *Test +#' | grep -v 'PendingSample\.' || true)
          if [ -n "$extra" ]; then
            echo "::error::Implement these pending (red) tests before merging:"
            echo "$extra"
            exit 1
          fi

  windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-debug, windows-msvc-release, windows-msvc-profile]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1
      - id: vcpkg
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-windows-${{ steps.vcpkg.outputs.commit }}-
      - run: external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} -L "unit|stress|benchmark|integration|golden" # GPU tests skip: no Vulkan driver

  coverage:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False $FEDORA_PACKAGES
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: vcpkg
        run: |
          git config --global --add safe.directory '*'
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-
      - run: external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset linux-clang-coverage
      - run: cmake --build --preset linux-clang-coverage
      - run: ctest --preset linux-clang-coverage
        env:
          INTERI_REQUIRE_GPU: 1
      - run: cmake --build --preset linux-clang-coverage --target coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build/linux-clang-coverage/coverage/html

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-asan, linux-clang-tsan]
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False $FEDORA_PACKAGES
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: vcpkg
        run: |
          git config --global --add safe.directory '*'
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-
      - run: external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: All non-pending tests (unit, integration, stress, golden)
        env:
          INTERI_REQUIRE_GPU: 1
        run: ctest --preset ${{ matrix.preset }}

  # Destruction frame-cost benchmarks against benchmarks/baselines (M7.6). Report-only: the stored baselines come from
  # a development machine, and the gate threshold is set once run-to-run noise on the runner has been measured.
  benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False $FEDORA_PACKAGES
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: vcpkg
        run: |
          git config --global --add safe.directory '*'
          echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-fedora44-${{ steps.vcpkg.outputs.commit }}-
      - run: external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset linux-clang-release
      - run: cmake --build --preset linux-clang-release --target interi_destruction_benchmarks interi_destruction_runtime_benchmarks
      - name: Run destruction benchmarks
        run: |
          mkdir -p bench-results
          build/linux-clang-release/benchmarks/destruction/interi_destruction_benchmarks \
            --benchmark_filter='BM_Stress|BM_Label' --benchmark_repetitions=5 --benchmark_report_aggregates_only=true \
            --benchmark_out=bench-results/destruction.json --benchmark_out_format=json
          build/linux-clang-release/benchmarks/destruction_runtime/interi_destruction_runtime_benchmarks \
            --benchmark_repetitions=3 --benchmark_report_aggregates_only=true \
            --benchmark_out=bench-results/destruction_runtime.json --benchmark_out_format=json
      - name: Compare against baselines (report only)
        run: |
          for name in destruction destruction_runtime; do
            python3 tools/bench_compare/compare_benchmarks.py --report-only \
              benchmarks/baselines/linux-clang-release/$name.json bench-results/$name.json | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: destruction-benchmarks
          path: bench-results
